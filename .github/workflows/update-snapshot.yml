name: Update HIP-4 market-data snapshot

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hip4-market-data-snapshot
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Test snapshot generator
        run: bun test

      - name: Generate current snapshot
        run: bun run snapshot

      - name: Commit snapshot
        run: |
          set -euo pipefail
          git config user.name "purrdict-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest snapshots
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "data: update HIP-4 market snapshot"
          git push
